name: CI/CD Pipeline

on:
  push:
    branches: ["main", "feature/cicd"] # Déclencheur

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupérer le code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Se connecter à Docker Hub (via les Secrets)
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Construire l'image et la pousser sur Docker Hub
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Image poussée vers votre repo Docker Hub (ex. abdel67/cicdabdel:latest)
          tags: ${{ secrets.DOCKER_USERNAME }}/cicdabdel:latest

  deploy:
    needs: build-and-push # Attendre la fin du build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        # Envoyer un signal à Render pour mettre à jour le site
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
